[pytest]
testpaths =
    scripts/testers
python_files = test_*.py
python_functions = test_*
addopts = -ra
markers =
    preproc: tests that require geospatial preprocessing dependencies (rasterio/gdal stack)
    train: tests that require training/inference ML dependencies (torch/lightning stack)
    data: tests that require local fixture files under data/
    slow: tests that are expected to run noticeably longer
    torch: tests requiring torch/segmentation-model stack